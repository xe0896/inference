syntax = "proto3";

option java_multiple_files = true;
option java_package = "inference";
option java_outer_classname = "InferenceProto";
option objc_class_prefix = "RTG";

package inference;

service InferenceService {
    rpc Generate(Conversation) returns (stream Response) {}
    rpc TokenCount(Messages) returns (TokenCountResponse) {}
}

service AuthenticationService {
    rpc Sign(Credentials) returns (LoginResult) {}
    rpc Login(Credentials) returns (LoginResult) {}
}

service StatService {
    rpc GetStats(UUID) returns (StatsResult) {}
}

message Conversation {
    Messages messages = 1;
    int32 max_tokens = 2;
    float temperature = 3;
    bool thinking = 4;
}

message UUID {
    string uuid = 1;
}

message StatsSuccess {
    int32 prompt_tokens = 1;
    int32 completion_tokens = 2;
    int32 requests = 3;
    int32 compaction = 4;
    int32 context_length = 5;
}

message TokenCountResponse {
    int32 normal_count = 1;
    int32 summary_count = 2;
}

message Credentials {
    string username = 1;
    string password = 2;
}

message Message {
    string role = 1;
    string content = 2;
}

message Messages {
    repeated Message message = 1;
}

message LoginSuccess {
    UUID uuid = 1;
    Messages history = 2;
}

message Response {
    oneof payload {
        Chunk chunk = 1;
        Done done = 2;
    }
}

message Chunk {
    Kind kind = 1;
    string text = 2;
}

message StatsResult {
    oneof payload {
        int32 status = 1;
        StatsSuccess success = 2;
    }
}

message LoginResult {
    oneof payload {
        int32 status = 1;
        LoginSuccess success = 2;
    }
}

enum Kind {
    KIND_UNSPECIFIED = 0;
    REASONING = 1;
    ANSWER = 2;
    COMPACT = 3;
    FINISHED_COMPACT = 4;
}

message Done {
    string finish_reason     = 1;  // "stop" or "length"
    int32  prompt_tokens     = 2;
    int32  completion_tokens = 3;
    double prefill_tps       = 4;  // prompt tokens per second
    double decode_tps        = 5;  // generated tokens per second
}
